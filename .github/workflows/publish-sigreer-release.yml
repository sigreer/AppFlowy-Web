name: Publish sigreer release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Rehearse without registry writes, or publish an approved rehearsal
        required: true
        type: choice
        options:
          - rehearse
          - publish
      release_id:
        description: Immutable sigreer release identifier
        required: true
        type: string
      source_tag:
        description: Annotated source tag, normally identical to release_id
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: p2s3-publication-${{ github.repository }}-${{ inputs.release_id }}
  cancel-in-progress: false

env:
  INPUT_MODE: ${{ inputs.mode }}
  INPUT_RELEASE_ID: ${{ inputs.release_id }}
  INPUT_SOURCE_TAG: ${{ inputs.source_tag }}
  SKOPEO_IMAGE: quay.io/skopeo/stable@sha256:bb88dcc894d09adc4b1330316a5694e75d57cd121bcb67b5128fcba2d7eca835
  BUILDX_METADATA_PROVENANCE: max
  INSPECT_OCI_SCRIPT: |
    verify_blob() {
      local layout=$1 digest=$2 hex blob actual
      [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
      hex=${digest#sha256:}; blob="$layout/blobs/sha256/$hex"
      test -f "$blob"
      actual=$(sha256sum "$blob" | cut -d' ' -f1)
      test "$actual" = "$hex"
    }
    extract_oci_archive() {
      local archive=$1 root_digest root_blob root_type manifest_blob
      OCI_LAYOUT=$(mktemp -d); tar -xf "$archive" -C "$OCI_LAYOUT"
      test "$(jq -r '.manifests | length' "$OCI_LAYOUT/index.json")" = 1
      root_digest=$(jq -er '.manifests[0].digest' "$OCI_LAYOUT/index.json")
      verify_blob "$OCI_LAYOUT" "$root_digest"
      root_blob="$OCI_LAYOUT/blobs/sha256/${root_digest#sha256:}"
      root_type=$(jq -r '.mediaType' "$root_blob")
      PRE_PUSH_MANIFEST_DIGEST=$root_digest
      if [[ "$root_type" == *image.index* || "$root_type" == *manifest.list* ]]; then
        PLATFORM_MANIFEST_DIGEST=$(jq -er '[.manifests[] | select(.platform.os=="linux" and .platform.architecture=="amd64")] | if length==1 then .[0].digest else error("amd64 manifest cardinality") end' "$root_blob")
      else PLATFORM_MANIFEST_DIGEST=$root_digest; fi
      verify_blob "$OCI_LAYOUT" "$PLATFORM_MANIFEST_DIGEST"
      manifest_blob="$OCI_LAYOUT/blobs/sha256/${PLATFORM_MANIFEST_DIGEST#sha256:}"
      CONFIG_DIGEST=$(jq -er '.config.digest' "$manifest_blob")
      verify_blob "$OCI_LAYOUT" "$CONFIG_DIGEST"
      CONFIG_BLOB="$OCI_LAYOUT/blobs/sha256/${CONFIG_DIGEST#sha256:}"
    }
    resolve_external_inputs() {
      BUILDKIT_MATERIALS=$(jq -cer '.["buildx.build.provenance"].materials | select(type=="array" and length>0)' <<<"$BUILD_METADATA")
      BASE_DIGESTS='[]'
      while IFS= read -r ref; do
        test -n "$ref"
        repository=${ref%%:*}
        material=$(jq -cer --arg repository "$repository" '[.[] | select(.uri | contains($repository))] | if length==1 then .[0] else error("base material cardinality") end' <<<"$BUILDKIT_MATERIALS")
        digest="sha256:$(jq -er '.digest.sha256' <<<"$material")"
        [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
        BASE_DIGESTS=$(jq -cn --argjson old "$BASE_DIGESTS" --arg reference "$ref" --arg digest "$digest" --argjson material "$material" '$old + [{reference:$reference,digest:$digest,material:$material}]')
      done <<<"$BASE_REFS"
      test "$(jq 'length' <<<"$BASE_DIGESTS")" -gt 0
      frontend_repository=${FRONTEND_REF%%:*}
      FRONTEND_IDENTITY=$(jq -cer --arg repository "$frontend_repository" '[.[] | select(.uri | contains($repository))] | if length==1 then .[0] else error("frontend material cardinality") end' <<<"$BUILDKIT_MATERIALS")
      FRONTEND_DIGEST="sha256:$(jq -er '.digest.sha256' <<<"$FRONTEND_IDENTITY")"
      [[ "$FRONTEND_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
    }
    assert_label() { local key=$1 expected=$2 actual; actual=$(jq -er --arg key "$key" '.config.Labels[$key]' "$CONFIG_BLOB"); test "$actual" = "$expected"; }
    assert_all_labels() {
      assert_label org.opencontainers.image.source "$EXPECTED_SOURCE"
      assert_label org.opencontainers.image.revision "$EXPECTED_REVISION"
      assert_label org.opencontainers.image.version "$EXPECTED_VERSION"
      assert_label org.opencontainers.image.title "$EXPECTED_TITLE"
      assert_label org.opencontainers.image.description "$EXPECTED_DESCRIPTION"
      assert_label org.opencontainers.image.licenses "$EXPECTED_LICENSES"
    }

jobs:
  verify-source:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_tag }}
          fetch-depth: 0
      - id: source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$INPUT_RELEASE_ID" =~ ^sigreer-p2s3-r[1-9][0-9]*$ ]]
          [[ "$INPUT_SOURCE_TAG" == "$INPUT_RELEASE_ID" ]]
          git fetch --force origin "refs/tags/$INPUT_SOURCE_TAG:refs/tags/$INPUT_SOURCE_TAG"
          test "$(git cat-file -t "refs/tags/$INPUT_SOURCE_TAG")" = tag
          peeled=$(git rev-parse "refs/tags/$INPUT_SOURCE_TAG^{}")
          test "$(git rev-parse HEAD)" = "$peeled"
          test -f docker/Dockerfile
          test -f pnpm-lock.yaml
          echo "source_sha=$peeled" >>"$GITHUB_OUTPUT"

  verify-own-rehearsal:
    if: inputs.mode == 'publish'
    needs: verify-source
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Verify own successful identical-tag rehearsal
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          workflow=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/publish-sigreer-release.yml")
          workflow_id=$(jq -er '.id' <<<"$workflow")
          runs=$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/publish-sigreer-release.yml/runs" -f event=workflow_dispatch -f status=success -f per_page=100)
          sha="${{ needs.verify-source.outputs.source_sha }}"
          ids=$(jq -r --argjson workflow_id "$workflow_id" --arg workflow_sha "$GITHUB_WORKFLOW_SHA" '[.workflow_runs[] | select(.workflow_id==$workflow_id and .path==".github/workflows/publish-sigreer-release.yml" and .name=="Publish sigreer release" and .head_sha==$workflow_sha and .event=="workflow_dispatch" and .conclusion=="success")] | sort_by(.created_at)|reverse | .[].id' <<<"$runs")
          found=false
          for id in $ids; do
            candidate_dir=$(mktemp -d); candidate_rejected=false
            if ! artifacts=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/artifacts"); then rm -rf "$candidate_dir"; continue; fi
            if ! artifact_inventory=$(jq -ce '[.artifacts[] | select(.name|startswith("p2s3-result-"))]' <<<"$artifacts") ||
               ! expired_artifacts=$(jq -e '[.[] | select(.expired==true)] | length' <<<"$artifact_inventory") ||
               ! unexpected_artifacts=$(jq -e '[.[] | select(.name != "p2s3-result-appflowy-web")] | length' <<<"$artifact_inventory") ||
               ! duplicate_artifacts=$(jq -e '[group_by(.name)[] | select(length != 1)] | length' <<<"$artifact_inventory") ||
               ! missing_artifacts=$(jq -e 'if ([.[].name] == ["p2s3-result-appflowy-web"]) then 0 else 1 end' <<<"$artifact_inventory"); then rm -rf "$candidate_dir"; continue; fi
            if test "$expired_artifacts" != 0 || test "$unexpected_artifacts" != 0 || test "$duplicate_artifacts" != 0 || test "$missing_artifacts" != 0; then rm -rf "$candidate_dir"; continue; fi
            mkdir "$candidate_dir/p2s3-result-appflowy-web"
            if ! url=$(jq -er '.[0].archive_download_url' <<<"$artifact_inventory"); then rm -rf "$candidate_dir"; continue; fi
            if ! curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "$url" -o "$candidate_dir/result.zip" || ! unzip -qq "$candidate_dir/result.zip" -d "$candidate_dir/p2s3-result-appflowy-web"; then candidate_rejected=true; fi
            if test "$candidate_rejected" = true || test "$(find "$candidate_dir/p2s3-result-appflowy-web" -type f -name result.json | wc -l)" != 1; then rm -rf "$candidate_dir"; continue; fi
            result="$candidate_dir/p2s3-result-appflowy-web/result.json"
            if ! distinct_recipes=$(jq -er '.recipe' "$result" | sort -u | wc -l); then rm -rf "$candidate_dir"; continue; fi
            if ! jq -e --arg tag "$INPUT_SOURCE_TAG" --arg sha "$sha" --arg workflow_sha "$GITHUB_WORKFLOW_SHA" --argjson run_id "$id" '.recipe=="appflowy-web" and .mode=="rehearse" and .source_tag==$tag and .source_sha==$sha and .workflow_sha==$workflow_sha and .run_id==$run_id and .inspected==true' "$result" >/dev/null || test "$distinct_recipes" != 1; then candidate_rejected=true; fi
            rm -rf "$candidate_dir"
            if test "$candidate_rejected" = true; then continue; fi
            found=true; break
          done
          test "$found" = true

  build-appflowy-web:
    needs: verify-source
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    env:
      RECIPE: appflowy-web
      DOCKERFILE: docker/Dockerfile
      PACKAGE: appflowy-web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_tag }}
          fetch-depth: 0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Verify recipe inputs
        run: test -f "$DOCKERFILE" && test -f pnpm-lock.yaml
      - name: Build push:false OCI archive
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: false
          outputs: type=oci,dest=/tmp/appflowy-web.oci
          provenance: false
          sbom: false
          cache-from: type=gha,scope=appflowy-web-${{ inputs.source_tag }}
          cache-to: type=gha,mode=max,scope=appflowy-web-${{ inputs.source_tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.verify-source.outputs.source_sha }}
            org.opencontainers.image.version=${{ inputs.release_id }}
            org.opencontainers.image.title=appflowy-web
            org.opencontainers.image.description=Sigreer AppFlowy Web release
            org.opencontainers.image.licenses=AGPL-3.0-only
      - name: Inspect archive and assert-labels
        if: inputs.mode == 'rehearse' || inputs.mode == 'publish'
        env:
          BASE_REFS: |-
            node:20.12.0-alpine
            nginx:1.25-alpine
          FRONTEND_REF: docker/dockerfile:1
          EXPECTED_SOURCE: https://github.com/${{ github.repository }}
          EXPECTED_REVISION: ${{ needs.verify-source.outputs.source_sha }}
          EXPECTED_VERSION: ${{ inputs.release_id }}
          EXPECTED_TITLE: appflowy-web
          EXPECTED_DESCRIPTION: Sigreer AppFlowy Web release
          EXPECTED_LICENSES: AGPL-3.0-only
          BUILD_METADATA: ${{ steps.build.outputs.metadata }}
        shell: bash
        run: |
          set -euo pipefail
          eval "$INSPECT_OCI_SCRIPT"
          extract_oci_archive /tmp/appflowy-web.oci
          resolve_external_inputs
          assert_all_labels
          source_sha="${{ needs.verify-source.outputs.source_sha }}"
          jq -n --arg mode "$INPUT_MODE" --arg source_tag "$INPUT_SOURCE_TAG" --arg source_sha "$source_sha" --arg workflow_sha "$GITHUB_WORKFLOW_SHA" --argjson run_id "$GITHUB_RUN_ID" --arg root "$PRE_PUSH_MANIFEST_DIGEST" --arg platform "$PLATFORM_MANIFEST_DIGEST" --arg config "$CONFIG_DIGEST" --argjson bases "$BASE_DIGESTS" --argjson materials "$BUILDKIT_MATERIALS" --arg frontend "$FRONTEND_DIGEST" --argjson frontend_identity "$FRONTEND_IDENTITY" '{recipe:"appflowy-web",mode:$mode,source_tag:$source_tag,source_sha:$source_sha,workflow_sha:$workflow_sha,run_id:$run_id,inspected:true,pre_push_manifest_digest:$root,platform_manifest_digest:$platform,registry_manifest_digest:false,config_digest:$config,base_digests:$bases,buildkit_materials:$materials,frontend_digest:$frontend,frontend_identity:$frontend_identity}' >/tmp/result.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p2s3-oci-appflowy-web
          path: /tmp/appflowy-web.oci
          retention-days: 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p2s3-result-appflowy-web
          path: /tmp/result.json
          retention-days: 7

  publish:
    if: inputs.mode == 'publish'
    needs: [verify-source, verify-own-rehearsal, build-appflowy-web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: p2s3-oci-appflowy-web
          path: /tmp/oci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: p2s3-result-appflowy-web
          path: /tmp/result
      - name: Refuse release collision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "checking collision for immutable release tag"
          if ! pages=$(gh api --paginate --slurp "/users/${GITHUB_REPOSITORY_OWNER,,}/packages/container/appflowy-web/versions?per_page=100" 2>/tmp/gh-error); then
            grep -q 'HTTP 404' /tmp/gh-error || { cat /tmp/gh-error >&2; exit 1; }
            pages='[[]]'
          fi
          collision_malformed=$(jq '[.[][] | select((.name|type)!="string" or (.metadata.container.tags|type)!="array")] | length' <<<"$pages")
          collision_matches=$(jq --arg tag "$INPUT_RELEASE_ID" '[.[][] | select(.metadata.container.tags | index($tag))] | length' <<<"$pages")
          collision_duplicates=$(jq --arg tag "$INPUT_RELEASE_ID" '[.[][] | select(.metadata.container.tags | index($tag)) | .name] | length - (unique|length)' <<<"$pages")
          test "$collision_malformed" = 0
          test "$collision_matches" = 0
          test "$collision_duplicates" = 0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
          logout: true
      - name: Copy OCI archive directly and assert registry digest
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/appflowy-web:$INPUT_RELEASE_ID"
          docker run --rm -v /tmp/oci:/archives -v "$HOME/.docker:/root/.docker:ro" "$SKOPEO_IMAGE" copy --all oci-archive:/archives/appflowy-web.oci "docker://$image"
          PRE_PUSH_MANIFEST_DIGEST=$(jq -r .pre_push_manifest_digest /tmp/result/result.json)
          REGISTRY_MANIFEST_DIGEST=$(docker run --rm -v "$HOME/.docker:/root/.docker:ro" "$SKOPEO_IMAGE" inspect --format '{{.Digest}}' "docker://$image")
          test "$PRE_PUSH_MANIFEST_DIGEST" = "$REGISTRY_MANIFEST_DIGEST"
          echo "registry_manifest_digest=$REGISTRY_MANIFEST_DIGEST" >>"$GITHUB_OUTPUT"
          jq --arg registry_manifest_digest "$REGISTRY_MANIFEST_DIGEST" '.registry_manifest_digest=$registry_manifest_digest' /tmp/result/result.json > /tmp/published.json
      - uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/appflowy-web
          subject-digest: ${{ steps.publish.outputs.registry_manifest_digest }}
          push-to-registry: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p2s3-published-appflowy-web
          path: /tmp/published.json
          retention-days: 7
