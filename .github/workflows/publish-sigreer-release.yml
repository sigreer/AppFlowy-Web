name: Publish sigreer release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Rehearse without registry writes, or publish an approved rehearsal
        required: true
        type: choice
        options:
          - rehearse
          - publish
          - prove
      release_id:
        description: Immutable sigreer release identifier
        required: true
        type: string
      source_tag:
        description: Annotated source tag, normally identical to release_id
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: p2s3-publication-${{ github.repository }}-${{ inputs.release_id }}
  cancel-in-progress: false

env:
  INPUT_MODE: ${{ inputs.mode }}
  INPUT_RELEASE_ID: ${{ inputs.release_id }}
  INPUT_SOURCE_TAG: ${{ inputs.source_tag }}
  SKOPEO_IMAGE: quay.io/skopeo/stable@sha256:0e392474a4383b733038b85eff26ade929d2ff10e8deead25a6add3ed79fb362
  SKOPEO_SOURCE_INDEX: quay.io/skopeo/stable@sha256:4a16d57b37617a04b3d643079a477a2848efe892dffcdf0ce56df4262b65f810
  COSIGN_AMD64_SHA256: c956e5dfcac53d52bcf058360d579472f0c1d2d9b69f55209e256fe7783f4c74
  COSIGN_PROVENANCE_SCRIPT: |
    verify_dsse() {
      local verified_file=$1 predicate_file=$2 package=$3 subject_digest=$4 repo=$5 ref=$6 sha=$7 recipe=$8 invocation=$9
      local statement_file digest_hex dependency_uri run_id=$GITHUB_RUN_ID run_attempt=$GITHUB_RUN_ATTEMPT
      [[ "$subject_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; digest_hex=${subject_digest#sha256:}; dependency_uri="git+https://github.com/$repo@$ref"
      jq -e 'type=="object" and keys==["payload","payloadType","signatures"] and .payloadType=="application/vnd.in-toto+json" and (.payload|type)=="string" and (.signatures|type)=="array" and (.signatures|length)==1' "$verified_file" >/dev/null
      test "$(jq -s 'length' "$verified_file")" -eq 1
      statement_file=$(mktemp); jq -er '.payload' "$verified_file" | base64 --decode >"$statement_file"
      jq -e --slurpfile predicate "$predicate_file" --arg package "$package" --arg digest_hex "$digest_hex" --arg repo "$repo" --arg ref "$ref" --arg sha "$sha" --arg recipe "$recipe" --arg invocation "$invocation" --arg dependency_uri "$dependency_uri" --argjson run_id "$run_id" --argjson run_attempt "$run_attempt" '
        ._type=="https://in-toto.io/Statement/v0.1" and .subject==[{name:$package,digest:{sha256:$digest_hex}}] and
        .predicateType=="https://slsa.dev/provenance/v1" and .predicate==$predicate[0] and
        .predicate.buildDefinition.externalParameters.source.repository==$repo and .predicate.buildDefinition.externalParameters.source.ref==$ref and
        .predicate.buildDefinition.externalParameters.source.sha==$sha and .predicate.buildDefinition.externalParameters.recipe==$recipe and
        .predicate.buildDefinition.externalParameters.run_id==$run_id and .predicate.buildDefinition.externalParameters.run_attempt==$run_attempt and
        .predicate.buildDefinition.externalParameters.trigger=="workflow_dispatch" and
        .predicate.buildDefinition.resolvedDependencies==[{uri:$dependency_uri,digest:{gitCommit:$sha}}] and
        .predicate.runDetails.metadata.invocationId==$invocation' "$statement_file" >/dev/null
      if [[ "$ref" == refs/heads/main ]]; then test "$recipe" = p2s3-cosign-proof; fi
    }
    verify_fetched_blob() {
      local file=$1 digest=$2 size=$3 actual
      [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
      [[ "$size" =~ ^[1-9][0-9]*$ ]]
      test "$(wc -c <"$file")" -eq "$size"
      actual=$(sha256sum "$file" | cut -d' ' -f1)
      test "sha256:$actual" = "$digest"
    }
    observe_referrer() {
      local package=$1 subject_digest=$2 verified_file=$3 registry_path challenge realm service token status index_file descriptor_digest descriptor_size manifest_file legacy_status
      local bundle_type=application/vnd.dev.sigstore.bundle.v0.3+json empty_type=application/vnd.oci.empty.v1+json referrers_mode referrer_tag
      local subject_file subject_media subject_size config_file config_digest config_size bundle_file bundle_digest bundle_size verified_envelope bundle_envelope config_raw
      registry_path=${package#ghcr.io/}; referrer_tag="sha256-${subject_digest#sha256:}"
      challenge=$(curl -sSI "https://ghcr.io/v2/$registry_path/manifests/$subject_digest" || true)
      realm=$(sed -n 's/^[Ww][Ww][Ww]-[Aa]uthenticate: Bearer realm="\([^"]*\)".*/\1/p' <<<"$challenge" | tr -d '\r'); service=$(sed -n 's/.*service="\([^"]*\)".*/\1/p' <<<"$challenge" | tr -d '\r')
      test -n "$realm"; test -n "$service"
      token=$(curl -fsSL -u "$GITHUB_ACTOR:$REGISTRY_TOKEN" -G "$realm" --data-urlencode "service=$service" --data-urlencode "scope=repository:$registry_path:pull" | jq -er '.token // .access_token')
      index_file=$(mktemp); status=$(curl -sS -o "$index_file" -w '%{http_code}' -H "Authorization: Bearer $token" -H 'Accept: application/vnd.oci.image.index.v1+json' "https://ghcr.io/v2/$registry_path/referrers/$subject_digest")
      case "$status" in
        200) jq -e --arg bundle_type "$bundle_type" 'type=="object" and .schemaVersion==2 and .mediaType=="application/vnd.oci.image.index.v1+json" and (.manifests|length)==1 and (.manifests[0]|keys==["artifactType","digest","mediaType","size"]) and .manifests[0].mediaType=="application/vnd.oci.image.manifest.v1+json" and .manifests[0].artifactType==$bundle_type' "$index_file" >/dev/null; referrers_mode=oci-1.1-referrers-api ;;
        404) curl -fsSL -H "Authorization: Bearer $token" -H 'Accept: application/vnd.oci.image.index.v1+json' "https://ghcr.io/v2/$registry_path/manifests/$referrer_tag" >"$index_file"; jq -e --arg empty_type "$empty_type" 'type=="object" and (keys==["manifests","mediaType","schemaVersion"] or keys==["annotations","manifests","mediaType","schemaVersion","subject"]) and .subject==null and .annotations==null and .schemaVersion==2 and .mediaType=="application/vnd.oci.image.index.v1+json" and (.manifests|length)==1 and (.manifests[0]|keys==["artifactType","digest","mediaType","size"]) and .manifests[0].mediaType=="application/vnd.oci.image.manifest.v1+json" and .manifests[0].artifactType==$empty_type' "$index_file" >/dev/null; referrers_mode=oci-1.1-tag-fallback ;;
        *) return 1 ;;
      esac
      descriptor_digest=$(jq -er '.manifests[0].digest' "$index_file"); [[ "$descriptor_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
      descriptor_size=$(jq -er '.manifests[0].size' "$index_file")
      manifest_file=$(mktemp); curl -fsSL -H "Authorization: Bearer $token" -H 'Accept: application/vnd.oci.image.manifest.v1+json' "https://ghcr.io/v2/$registry_path/manifests/$descriptor_digest" >"$manifest_file"; verify_fetched_blob "$manifest_file" "$descriptor_digest" "$descriptor_size"
      jq -e --arg subject_digest "$subject_digest" --arg bundle_type "$bundle_type" --arg empty_type "$empty_type" 'type=="object" and keys==["annotations","artifactType","config","layers","mediaType","schemaVersion","subject"] and .schemaVersion==2 and .mediaType=="application/vnd.oci.image.manifest.v1+json" and .artifactType==$bundle_type and (.subject|keys==["digest","mediaType","size"]) and .subject.digest==$subject_digest and (.config|keys==["artifactType","digest","mediaType","size"]) and .config.mediaType==$empty_type and .config.artifactType==$bundle_type and .config.size==2 and .config.digest=="sha256:44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" and (.layers|length)==1 and (.layers[0]|keys==["digest","mediaType","size"]) and .layers[0].mediaType==$bundle_type and (.annotations|keys==["dev.sigstore.bundle.content","dev.sigstore.bundle.predicateType","org.opencontainers.image.created"]) and .annotations["dev.sigstore.bundle.content"]=="dsse-envelope" and .annotations["dev.sigstore.bundle.predicateType"]=="https://sigstore.dev/cosign/sign/v1" and (.annotations["org.opencontainers.image.created"]|test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\\.[0-9]+)?Z$"))' "$manifest_file" >/dev/null
      subject_media=$(jq -er '.subject.mediaType' "$manifest_file"); subject_size=$(jq -er '.subject.size' "$manifest_file"); subject_file=$(mktemp); curl -fsSL -H "Authorization: Bearer $token" -H "Accept: $subject_media" "https://ghcr.io/v2/$registry_path/manifests/$subject_digest" >"$subject_file"; verify_fetched_blob "$subject_file" "$subject_digest" "$subject_size"
      config_digest=$(jq -er '.config.digest' "$manifest_file"); config_size=$(jq -er '.config.size' "$manifest_file"); config_file=$(mktemp); curl -fsSL -H "Authorization: Bearer $token" "https://ghcr.io/v2/$registry_path/blobs/$config_digest" >"$config_file"; verify_fetched_blob "$config_file" "$config_digest" "$config_size"; config_raw=$(cat "$config_file"); test "$config_raw" = "{}"
      bundle_digest=$(jq -er '.layers[0].digest' "$manifest_file"); bundle_size=$(jq -er '.layers[0].size' "$manifest_file"); bundle_file=$(mktemp); curl -fsSL -H "Authorization: Bearer $token" "https://ghcr.io/v2/$registry_path/blobs/$bundle_digest" >"$bundle_file"; verify_fetched_blob "$bundle_file" "$bundle_digest" "$bundle_size"
      jq -e --arg bundle_type "$bundle_type" 'type=="object" and keys==["dsseEnvelope","mediaType","verificationMaterial"] and .mediaType==$bundle_type and (.dsseEnvelope|type)=="object" and (.dsseEnvelope|keys)==["payload","payloadType","signatures"]' "$bundle_file" >/dev/null
      verified_envelope=$(jq -S -c . "$verified_file"); bundle_envelope=$(jq -S -c .dsseEnvelope "$bundle_file"); test "$verified_envelope" = "$bundle_envelope"
      legacy_status=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $token" "https://ghcr.io/v2/$registry_path/manifests/$referrer_tag.att"); test "$legacy_status" = 404 # legacy .att referrer forbidden
      OBSERVED_REFERRERS_MODE=$referrers_mode; OBSERVED_BUNDLE_MEDIA_TYPE=$bundle_type; OBSERVED_REFERRER_TAG=$referrer_tag; OBSERVED_DESCRIPTOR_DIGEST=$descriptor_digest
    }
  BUILDX_METADATA_PROVENANCE: max
  INSPECT_OCI_SCRIPT: |
    verify_blob() {
      local layout=$1 digest=$2 hex blob actual
      [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
      hex=${digest#sha256:}; blob="$layout/blobs/sha256/$hex"
      test -f "$blob"
      actual=$(sha256sum "$blob" | cut -d' ' -f1)
      test "$actual" = "$hex"
    }
    extract_oci_archive() {
      local archive=$1 root_digest root_blob root_type manifest_blob
      OCI_LAYOUT=$(mktemp -d); tar -xf "$archive" -C "$OCI_LAYOUT"
      test "$(jq -r '.manifests | length' "$OCI_LAYOUT/index.json")" = 1
      root_digest=$(jq -er '.manifests[0].digest' "$OCI_LAYOUT/index.json")
      verify_blob "$OCI_LAYOUT" "$root_digest"
      root_blob="$OCI_LAYOUT/blobs/sha256/${root_digest#sha256:}"
      root_type=$(jq -r '.mediaType' "$root_blob")
      PRE_PUSH_MANIFEST_DIGEST=$root_digest
      if [[ "$root_type" == *image.index* || "$root_type" == *manifest.list* ]]; then
        PLATFORM_MANIFEST_DIGEST=$(jq -er '[.manifests[] | select(.platform.os=="linux" and .platform.architecture=="amd64")] | if length==1 then .[0].digest else error("amd64 manifest cardinality") end' "$root_blob")
      else PLATFORM_MANIFEST_DIGEST=$root_digest; fi
      verify_blob "$OCI_LAYOUT" "$PLATFORM_MANIFEST_DIGEST"
      manifest_blob="$OCI_LAYOUT/blobs/sha256/${PLATFORM_MANIFEST_DIGEST#sha256:}"
      CONFIG_DIGEST=$(jq -er '.config.digest' "$manifest_blob")
      verify_blob "$OCI_LAYOUT" "$CONFIG_DIGEST"
      CONFIG_BLOB="$OCI_LAYOUT/blobs/sha256/${CONFIG_DIGEST#sha256:}"
    }
    resolve_external_inputs() {
      BUILDKIT_MATERIALS=$(jq -cer '.["buildx.build.provenance"].materials | select(type=="array" and length>0)' "$BUILD_METADATA_FILE")
      BASE_DIGESTS='[]'
      while IFS= read -r ref; do
        test -n "$ref"
        repository=${ref%%:*}
        material=$(jq -cer --arg repository "$repository" '[.[] | select(.uri | contains($repository))] | if length==1 then .[0] else error("base material cardinality") end' <<<"$BUILDKIT_MATERIALS")
        digest="sha256:$(jq -er '.digest.sha256' <<<"$material")"
        [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
        BASE_DIGESTS=$(jq -cn --argjson old "$BASE_DIGESTS" --arg reference "$ref" --arg digest "$digest" --argjson material "$material" '$old + [{reference:$reference,digest:$digest,material:$material}]')
      done <<<"$BASE_REFS"
      test "$(jq 'length' <<<"$BASE_DIGESTS")" -gt 0
      frontend_repository=${FRONTEND_REF%%:*}
      FRONTEND_IDENTITY=$(jq -cer --arg repository "$frontend_repository" '[.[] | select(.uri | contains($repository))] | if length==1 then .[0] else error("frontend material cardinality") end' <<<"$BUILDKIT_MATERIALS")
      FRONTEND_DIGEST="sha256:$(jq -er '.digest.sha256' <<<"$FRONTEND_IDENTITY")"
      [[ "$FRONTEND_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
    }
    assert_label() { local key=$1 expected=$2 actual; actual=$(jq -er --arg key "$key" '.config.Labels[$key]' "$CONFIG_BLOB"); test "$actual" = "$expected"; }
    assert_all_labels() {
      assert_label org.opencontainers.image.source "$EXPECTED_SOURCE"
      assert_label org.opencontainers.image.revision "$EXPECTED_REVISION"
      assert_label org.opencontainers.image.version "$EXPECTED_VERSION"
      assert_label org.opencontainers.image.title "$EXPECTED_TITLE"
      assert_label org.opencontainers.image.description "$EXPECTED_DESCRIPTION"
      assert_label org.opencontainers.image.licenses "$EXPECTED_LICENSES"
    }

jobs:
  verify-source:
    if: inputs.mode != 'prove'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_tag }}
          fetch-depth: 0
      - id: source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$INPUT_MODE" == rehearse || "$INPUT_MODE" == publish ]]
          [[ "$INPUT_RELEASE_ID" =~ ^sigreer-p2s3-r[1-9][0-9]*$ ]]
          [[ "$INPUT_SOURCE_TAG" == "$INPUT_RELEASE_ID" ]]
          git fetch --force origin "refs/tags/$INPUT_SOURCE_TAG:refs/tags/$INPUT_SOURCE_TAG"
          test "$(git cat-file -t "refs/tags/$INPUT_SOURCE_TAG")" = tag
          peeled=$(git rev-parse "refs/tags/$INPUT_SOURCE_TAG^{}")
          test "$(git rev-parse HEAD)" = "$peeled"
          test -f docker/Dockerfile
          test -f pnpm-lock.yaml
          echo "source_sha=$peeled" >>"$GITHUB_OUTPUT"

  verify-own-rehearsal:
    if: inputs.mode == 'publish'
    needs: verify-source
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Verify own successful identical-tag rehearsal
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          workflow=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/publish-sigreer-release.yml")
          workflow_id=$(jq -er '.id' <<<"$workflow")
          run_pages=$(gh api --paginate --slurp -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/publish-sigreer-release.yml/runs" -f event=workflow_dispatch -f status=success -f per_page=100)
          malformed_run_pages=$(jq '[.[] | select(type!="object" or (.workflow_runs|type)!="array")] | length' <<<"$run_pages")
          test "$malformed_run_pages" = 0
          flattened_runs=$(jq -ce '[.[] | .workflow_runs[] | select(type=="object" and (.id|type)=="number" and (.created_at|type)=="string")]' <<<"$run_pages")
          duplicate_run_ids=$(jq '[group_by(.id)[] | select(length != 1)] | length' <<<"$flattened_runs")
          test "$duplicate_run_ids" = 0
          sha="${{ needs.verify-source.outputs.source_sha }}"
          ids=$(jq -r --argjson workflow_id "$workflow_id" --arg workflow_sha "$GITHUB_WORKFLOW_SHA" '[.[] | select(.workflow_id==$workflow_id and .path==".github/workflows/publish-sigreer-release.yml" and .name=="Publish sigreer release" and .head_sha==$workflow_sha and .event=="workflow_dispatch" and .conclusion=="success")] | sort_by([.created_at,.id])|reverse | .[].id' <<<"$flattened_runs")
          found=false
          for id in $ids; do
            candidate_dir=$(mktemp -d); candidate_rejected=false
            if ! artifacts=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/artifacts"); then rm -rf "$candidate_dir"; continue; fi
            if ! artifact_inventory=$(jq -ce '[.artifacts[] | select(.name|startswith("p2s3-result-"))]' <<<"$artifacts") ||
               ! expired_artifacts=$(jq -e '[.[] | select(.expired==true)] | length' <<<"$artifact_inventory") ||
               ! unexpected_artifacts=$(jq -e '[.[] | select(.name != "p2s3-result-appflowy-web")] | length' <<<"$artifact_inventory") ||
               ! duplicate_artifacts=$(jq -e '[group_by(.name)[] | select(length != 1)] | length' <<<"$artifact_inventory") ||
               ! missing_artifacts=$(jq -e 'if ([.[].name] == ["p2s3-result-appflowy-web"]) then 0 else 1 end' <<<"$artifact_inventory"); then rm -rf "$candidate_dir"; continue; fi
            if test "$expired_artifacts" != 0 || test "$unexpected_artifacts" != 0 || test "$duplicate_artifacts" != 0 || test "$missing_artifacts" != 0; then rm -rf "$candidate_dir"; continue; fi
            mkdir "$candidate_dir/p2s3-result-appflowy-web"
            if ! url=$(jq -er '.[0].archive_download_url' <<<"$artifact_inventory"); then rm -rf "$candidate_dir"; continue; fi
            if ! curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "$url" -o "$candidate_dir/result.zip" || ! unzip -qq "$candidate_dir/result.zip" -d "$candidate_dir/p2s3-result-appflowy-web"; then candidate_rejected=true; fi
            if test "$candidate_rejected" = true || test "$(find "$candidate_dir/p2s3-result-appflowy-web" -type f -name result.json | wc -l)" != 1; then rm -rf "$candidate_dir"; continue; fi
            result="$candidate_dir/p2s3-result-appflowy-web/result.json"
            if ! distinct_recipes=$(jq -er '.recipe' "$result" | sort -u | wc -l); then rm -rf "$candidate_dir"; continue; fi
            if ! jq -e --arg tag "$INPUT_SOURCE_TAG" --arg sha "$sha" --arg workflow_sha "$GITHUB_WORKFLOW_SHA" --argjson run_id "$id" '.recipe=="appflowy-web" and .mode=="rehearse" and .source_tag==$tag and .source_sha==$sha and .workflow_sha==$workflow_sha and .run_id==$run_id and .inspected==true' "$result" >/dev/null || test "$distinct_recipes" != 1; then candidate_rejected=true; fi
            rm -rf "$candidate_dir"
            if test "$candidate_rejected" = true; then continue; fi
            found=true; break
          done
          test "$found" = true

  build-appflowy-web:
    if: inputs.mode != 'prove'
    needs: [verify-source, verify-publish-helper]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    env:
      RECIPE: appflowy-web
      DOCKERFILE: docker/Dockerfile
      PACKAGE: appflowy-web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_tag }}
          fetch-depth: 0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Verify recipe inputs
        run: test -f "$DOCKERFILE" && test -f pnpm-lock.yaml
      - name: Build push:false OCI archive
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: false
          outputs: type=oci,dest=/tmp/appflowy-web.oci
          provenance: false
          sbom: false
          cache-from: type=gha,scope=appflowy-web-${{ inputs.source_tag }}
          cache-to: type=gha,mode=max,scope=appflowy-web-${{ inputs.source_tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.verify-source.outputs.source_sha }}
            org.opencontainers.image.version=${{ inputs.release_id }}
            org.opencontainers.image.title=appflowy-web
            org.opencontainers.image.description=Sigreer AppFlowy Web release
            org.opencontainers.image.licenses=AGPL-3.0-only
      - name: Materialize bounded Buildx metadata
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' metadata_files < <(find "$RUNNER_TEMP" -path '*/docker-actions-toolkit-*' -type f -name 'build-metadata-*.json' -print0)
          test "${#metadata_files[@]}" -eq 1
          install -m 0600 "${metadata_files[0]}" /tmp/appflowy-web-build-metadata.json
          BUILD_METADATA_FILE=/tmp/appflowy-web-build-metadata.json
          jq -e . "$BUILD_METADATA_FILE" >/dev/null
      - name: Inspect archive and assert-labels
        if: inputs.mode == 'rehearse' || inputs.mode == 'publish'
        env:
          BASE_REFS: |-
            node:20.12.0-alpine
            nginx:1.25-alpine
          FRONTEND_REF: docker/dockerfile:1
          EXPECTED_SOURCE: https://github.com/${{ github.repository }}
          EXPECTED_REVISION: ${{ needs.verify-source.outputs.source_sha }}
          EXPECTED_VERSION: ${{ inputs.release_id }}
          EXPECTED_TITLE: appflowy-web
          EXPECTED_DESCRIPTION: Sigreer AppFlowy Web release
          EXPECTED_LICENSES: AGPL-3.0-only
          BUILD_METADATA_FILE: /tmp/appflowy-web-build-metadata.json
        shell: bash
        run: |
          set -euo pipefail
          eval "$INSPECT_OCI_SCRIPT"
          extract_oci_archive /tmp/appflowy-web.oci
          resolve_external_inputs
          assert_all_labels
          source_sha="${{ needs.verify-source.outputs.source_sha }}"
          jq -n --arg mode "$INPUT_MODE" --arg source_tag "$INPUT_SOURCE_TAG" --arg source_sha "$source_sha" --arg workflow_sha "$GITHUB_WORKFLOW_SHA" --argjson run_id "$GITHUB_RUN_ID" --arg root "$PRE_PUSH_MANIFEST_DIGEST" --arg platform "$PLATFORM_MANIFEST_DIGEST" --arg config "$CONFIG_DIGEST" --argjson bases "$BASE_DIGESTS" --argjson materials "$BUILDKIT_MATERIALS" --arg frontend "$FRONTEND_DIGEST" --argjson frontend_identity "$FRONTEND_IDENTITY" '{recipe:"appflowy-web",mode:$mode,source_tag:$source_tag,source_sha:$source_sha,workflow_sha:$workflow_sha,run_id:$run_id,inspected:true,pre_push_manifest_digest:$root,platform_manifest_digest:$platform,registry_manifest_digest:false,config_digest:$config,base_digests:$bases,buildkit_materials:$materials,frontend_digest:$frontend,frontend_identity:$frontend_identity}' >/tmp/result.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p2s3-oci-appflowy-web
          path: /tmp/appflowy-web.oci
          retention-days: 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p2s3-result-appflowy-web
          path: /tmp/result.json
          retention-days: 7

  verify-publish-helper:
    if: inputs.mode != 'prove'
    needs: verify-source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with: {cosign-release: v3.0.6}
      - name: Verify pinned Cosign and bounded rehearsal predicate
        run: |
          set -euo pipefail
          eval "$COSIGN_PROVENANCE_SCRIPT"
          test "$(sha256sum "$(command -v cosign)" | cut -d' ' -f1)" = "$COSIGN_AMD64_SHA256"
          cosign version | grep -F 'GitVersion: v3.0.6'
          invocation="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT"
          jq -n --arg repo "$GITHUB_REPOSITORY" --arg ref "refs/tags/$INPUT_SOURCE_TAG" --arg sha "${{ needs.verify-source.outputs.source_sha }}" --arg invocation "$invocation" --argjson run_id "$GITHUB_RUN_ID" --argjson run_attempt "$GITHUB_RUN_ATTEMPT" '{buildDefinition:{buildType:"https://github.com/sigreer/appflowy/.github/workflows/publish-sigreer-release.yml@v1",externalParameters:{source:{repository:$repo,ref:$ref,sha:$sha},recipe:"rehearsal",run_id:$run_id,run_attempt:$run_attempt,trigger:"workflow_dispatch"},internalParameters:{},resolvedDependencies:[{uri:("git+https://github.com/"+$repo+"@"+$ref),digest:{gitCommit:$sha}}]},runDetails:{builder:{id:("https://github.com/"+$repo+"/.github/workflows/publish-sigreer-release.yml@refs/heads/main")},metadata:{invocationId:$invocation}}}' >/tmp/predicate.json
          jq -e --arg invocation "$invocation" '.buildDefinition.externalParameters.source.repository==env.GITHUB_REPOSITORY and .runDetails.metadata.invocationId==$invocation and (.buildDefinition.resolvedDependencies|length)==1' /tmp/predicate.json >/dev/null
      - name: Verify immutable linux-amd64 publish helper
        run: |
          set -euo pipefail
          helper_digest=${SKOPEO_IMAGE##*@}
          index=$(docker manifest inspect "$SKOPEO_SOURCE_INDEX")
          matches=$(jq --arg helper_digest "$helper_digest" '[.manifests[] | select(.platform.os=="linux" and .platform.architecture=="amd64" and .digest==$helper_digest)] | length' <<<"$index")
          test "$matches" -eq 1
          docker pull --platform linux/amd64 "$SKOPEO_IMAGE"
          docker run --rm --platform linux/amd64 "$SKOPEO_IMAGE" --version

  publish:
    if: inputs.mode == 'publish'
    needs: [verify-source, verify-own-rehearsal, build-appflowy-web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Guard reviewed workflow context
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_SHA" = "$GITHUB_WORKFLOW_SHA"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: p2s3-oci-appflowy-web
          path: /tmp/oci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: p2s3-result-appflowy-web
          path: /tmp/result
      - name: Refuse release collision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "checking collision for immutable release tag"
          if ! pages=$(gh api --paginate --slurp "/users/${GITHUB_REPOSITORY_OWNER,,}/packages/container/appflowy-web/versions?per_page=100" 2>/tmp/gh-error); then
            grep -q 'HTTP 404' /tmp/gh-error || { cat /tmp/gh-error >&2; exit 1; }
            pages='[[]]'
          fi
          collision_malformed=$(jq '[.[][] | select((.name|type)!="string" or (.metadata.container.tags|type)!="array")] | length' <<<"$pages")
          collision_matches=$(jq --arg tag "$INPUT_RELEASE_ID" '[.[][] | select(.metadata.container.tags | index($tag))] | length' <<<"$pages")
          collision_duplicates=$(jq --arg tag "$INPUT_RELEASE_ID" '[.[][] | select(.metadata.container.tags | index($tag)) | .name] | length - (unique|length)' <<<"$pages")
          test "$collision_malformed" = 0
          test "$collision_matches" = 0
          test "$collision_duplicates" = 0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
          logout: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with: {cosign-release: v3.0.6}
      - name: Verify pinned Cosign
        run: test "$(sha256sum "$(command -v cosign)" | cut -d' ' -f1)" = "$COSIGN_AMD64_SHA256"
      - name: Verify helper consumes registry credentials
        shell: bash
        run: |
          set -euo pipefail
          registry_login=$(docker run --rm -v "$HOME/.docker/config.json:/tmp/auth.json:ro" "$SKOPEO_IMAGE" login --get-login ghcr.io)
          test "$registry_login" = "$GITHUB_ACTOR"
      - name: Copy OCI archive directly and assert registry digest
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/appflowy-web:$INPUT_RELEASE_ID"
          docker run --rm -v /tmp/oci:/archives -v "$HOME/.docker/config.json:/tmp/auth.json:ro" "$SKOPEO_IMAGE" copy --all oci-archive:/archives/appflowy-web.oci "docker://$image"
          PRE_PUSH_MANIFEST_DIGEST=$(jq -r .pre_push_manifest_digest /tmp/result/result.json)
          REGISTRY_MANIFEST_DIGEST=$(docker run --rm -v "$HOME/.docker/config.json:/tmp/auth.json:ro" "$SKOPEO_IMAGE" inspect --format '{{.Digest}}' "docker://$image")
          test "$PRE_PUSH_MANIFEST_DIGEST" = "$REGISTRY_MANIFEST_DIGEST"
          echo "registry_manifest_digest=$REGISTRY_MANIFEST_DIGEST" >>"$GITHUB_OUTPUT"
          jq --arg registry_manifest_digest "$REGISTRY_MANIFEST_DIGEST" '.registry_manifest_digest=$registry_manifest_digest' /tmp/result/result.json > /tmp/published.json
      - name: Attest and immediately verify SLSA v1 provenance
        env:
          PACKAGE: ghcr.io/${{ github.repository_owner }}/appflowy-web
          REGISTRY_MANIFEST_DIGEST: ${{ steps.publish.outputs.registry_manifest_digest }}
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          eval "$COSIGN_PROVENANCE_SCRIPT"
          package=${PACKAGE,,}; registry_manifest_digest=$REGISTRY_MANIFEST_DIGEST; repo=$GITHUB_REPOSITORY
          predicate_file=$(mktemp); verified_file=$(mktemp); source_ref="refs/tags/$INPUT_SOURCE_TAG"; source_sha="${{ needs.verify-source.outputs.source_sha }}"; recipe=appflowy-web; invocation="https://github.com/$repo/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT"
          jq -n --arg repo "$repo" --arg ref "$source_ref" --arg sha "$source_sha" --arg recipe "$recipe" --arg invocation "$invocation" --argjson run_id "$GITHUB_RUN_ID" --argjson run_attempt "$GITHUB_RUN_ATTEMPT" '{buildDefinition:{buildType:"https://github.com/sigreer/appflowy/.github/workflows/publish-sigreer-release.yml@v1",externalParameters:{source:{repository:$repo,ref:$ref,sha:$sha},recipe:$recipe,run_id:$run_id,run_attempt:$run_attempt,trigger:"workflow_dispatch"},internalParameters:{},resolvedDependencies:[{uri:("git+https://github.com/"+$repo+"@"+$ref),digest:{gitCommit:$sha}}]},runDetails:{builder:{id:("https://github.com/"+$repo+"/.github/workflows/publish-sigreer-release.yml@refs/heads/main")},metadata:{invocationId:$invocation}}}' >"$predicate_file"
          jq -e --arg invocation "$invocation" '.buildDefinition.externalParameters.source.repository==env.GITHUB_REPOSITORY and .runDetails.metadata.invocationId==$invocation and (.buildDefinition.resolvedDependencies|length)==1' "$predicate_file" >/dev/null
          cosign attest --yes --new-bundle-format=true --oidc-provider github-actions --type slsaprovenance1 --predicate "$predicate_file" "$package@$registry_manifest_digest"
          cosign verify-attestation --new-bundle-format=true --type slsaprovenance1 --certificate-identity "https://github.com/$repo/.github/workflows/publish-sigreer-release.yml@refs/heads/main" --certificate-oidc-issuer https://token.actions.githubusercontent.com --certificate-github-workflow-repository "$repo" --certificate-github-workflow-ref refs/heads/main --certificate-github-workflow-sha "$GITHUB_SHA" --certificate-github-workflow-trigger workflow_dispatch "$package@$registry_manifest_digest" >"$verified_file"
          verify_dsse "$verified_file" "$predicate_file" "$package" "$registry_manifest_digest" "$repo" "$source_ref" "$source_sha" "$recipe" "$invocation"
          observe_referrer "$package" "$registry_manifest_digest" "$verified_file"
          jq --arg mode "$OBSERVED_REFERRERS_MODE" --arg media_type "$OBSERVED_BUNDLE_MEDIA_TYPE" --arg referrer_tag "$OBSERVED_REFERRER_TAG" --arg descriptor "$OBSERVED_DESCRIPTOR_DIGEST" '.provenance={mechanism:"cosign",predicate_type:"https://slsa.dev/provenance/v1",bundle_media_type:$media_type,referrers_mode:$mode,referrer_tag:(if $mode=="oci-1.1-tag-fallback" then $referrer_tag else null end),descriptor_digest:$descriptor,verified:true}' /tmp/published.json >/tmp/published.with-provenance.json
          mv /tmp/published.with-provenance.json /tmp/published.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p2s3-published-appflowy-web
          path: /tmp/published.json
          retention-days: 7

  prove-cosign:
    if: inputs.mode == 'prove'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: p2s3-proof-${{ github.repository }}-${{ github.run_id }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Guard reviewed workflow context
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_SHA" = "$GITHUB_WORKFLOW_SHA"
      - name: Validate proof sentinels and build fixed image
        run: |
          set -euo pipefail
          [[ "$INPUT_RELEASE_ID" == p2s3-proof ]]
          [[ "$INPUT_SOURCE_TAG" == p2s3-proof ]]
          proof_name="p2s3-cosign-preflight-web-$(date -u +%Y%m%d)-${GITHUB_RUN_ID}"
          [[ "$proof_name" =~ ^p2s3-cosign-preflight-web-[0-9]{8}-[0-9]+$ ]]
          tmp=$(mktemp -d); printf 'p2s3 cosign proof\n' >"$tmp/proof.txt"
          printf 'FROM scratch\nCOPY proof.txt /proof.txt\n' >"$tmp/Dockerfile"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$proof_name:proof-${GITHUB_RUN_ID}"
          docker build --platform linux/amd64 -t "$image" "$tmp"
          echo "image=$image" >>"$GITHUB_ENV"; echo "proof_name=$proof_name" >>"$GITHUB_ENV"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ github.token }}", logout: true}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with: {cosign-release: v3.0.6}
      - name: Push, attest, verify, and classify OCI referrer
        env: {REGISTRY_TOKEN: "${{ github.token }}"}
        run: |
          set -euo pipefail
          eval "$COSIGN_PROVENANCE_SCRIPT"
          test "$(sha256sum "$(command -v cosign)" | cut -d' ' -f1)" = "$COSIGN_AMD64_SHA256"
          push_output=$(docker push "$image" 2>&1); printf '%s\n' "$push_output"
          registry_manifest_digest=$(sed -n 's/^.*digest: \(sha256:[0-9a-f]\{64\}\).*$/\1/p' <<<"$push_output" | tail -1)
          [[ "$registry_manifest_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          package=${image%:*}; repo=$GITHUB_REPOSITORY; predicate_file=$(mktemp); verified_file=$(mktemp); source_ref=refs/heads/main; source_sha=$GITHUB_SHA; recipe=p2s3-cosign-proof; test "$recipe" = p2s3-cosign-proof
          invocation="https://github.com/$repo/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT"
          jq -n --arg repo "$repo" --arg ref "$source_ref" --arg sha "$source_sha" --arg recipe "$recipe" --arg invocation "$invocation" --argjson run_id "$GITHUB_RUN_ID" --argjson run_attempt "$GITHUB_RUN_ATTEMPT" '{buildDefinition:{buildType:"https://github.com/sigreer/appflowy/.github/workflows/publish-sigreer-release.yml@v1",externalParameters:{source:{repository:$repo,ref:$ref,sha:$sha},recipe:$recipe,run_id:$run_id,run_attempt:$run_attempt,trigger:"workflow_dispatch"},internalParameters:{},resolvedDependencies:[{uri:("git+https://github.com/"+$repo+"@"+$ref),digest:{gitCommit:$sha}}]},runDetails:{builder:{id:("https://github.com/"+$repo+"/.github/workflows/publish-sigreer-release.yml@refs/heads/main")},metadata:{invocationId:$invocation}}}' >"$predicate_file"
          jq -e --arg invocation "$invocation" '.buildDefinition.externalParameters.source.repository==env.GITHUB_REPOSITORY and .runDetails.metadata.invocationId==$invocation and (.buildDefinition.resolvedDependencies|length)==1' "$predicate_file" >/dev/null
          cosign attest --yes --new-bundle-format=true --oidc-provider github-actions --type slsaprovenance1 --predicate "$predicate_file" "$package@$registry_manifest_digest"
          cosign verify-attestation --new-bundle-format=true --type slsaprovenance1 --certificate-identity "https://github.com/$repo/.github/workflows/publish-sigreer-release.yml@refs/heads/main" --certificate-oidc-issuer https://token.actions.githubusercontent.com --certificate-github-workflow-repository "$repo" --certificate-github-workflow-ref refs/heads/main --certificate-github-workflow-sha "$GITHUB_SHA" --certificate-github-workflow-trigger workflow_dispatch "$package@$registry_manifest_digest" >"$verified_file"
          verify_dsse "$verified_file" "$predicate_file" "$package" "$registry_manifest_digest" "$repo" "$source_ref" "$source_sha" "$recipe" "$invocation"
          observe_referrer "$package" "$registry_manifest_digest" "$verified_file"
          jq -n --arg package "$package" --arg digest "$registry_manifest_digest" --arg media_type "$OBSERVED_BUNDLE_MEDIA_TYPE" --arg mode "$OBSERVED_REFERRERS_MODE" --arg referrer_tag "$OBSERVED_REFERRER_TAG" --arg descriptor "$OBSERVED_DESCRIPTOR_DIGEST" '{package:$package,subject_digest:$digest,predicate_type:"https://slsa.dev/provenance/v1",bundle_media_type:$media_type,referrers_mode:$mode,referrer_tag:(if $mode=="oci-1.1-tag-fallback" then $referrer_tag else null end),descriptor_digest:$descriptor,verified:true}' >/tmp/proof-result.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: p2s3-cosign-proof-web, path: /tmp/proof-result.json, retention-days: 7}
